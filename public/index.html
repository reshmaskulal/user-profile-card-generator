
<!DOCTYPE html>
<html>
<head>
    <title>User Profile Card Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>User Profile Card Generator</h1>
        <p>Create your profile card</p>

        <form action="/create-profile" method="POST">

            <label>Name</label>
            <input type="text" name="name" placeholder="Enter your name" required>

            <label>Bio</label>
            <textarea name="bio" placeholder="Write a short bio" required></textarea>

            <label>Skills</label>
            <input type="text" name="skills" placeholder="Python, JavaScript, HTML" required>

            <label>Social Link</label>
            <input type="url" name="social" placeholder="https://github.com/username" required>

            <button type="submit">Create Profile</button>

        </form>

    </div>

</body>
</html>
